<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#12a150;--gd:#0c7a3b;--gs:#e5f6ec;--bg:#f3f5f7;--card:#fff;--tx:#1b2430;--mu:#7a8794;--bd:#e6eaee;--rd:#e5484d;--rs:#fdeaea;--am:#f5a524;--as:#fff4dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1418;--card:#182027;--tx:#e9eef2;--mu:#8e9ba7;--bd:#26313a;--gs:#12301f;--rs:#3a1a1c;--as:#3a2e12}}
:root[data-theme="dark"]{--bg:#0f1418;--card:#182027;--tx:#e9eef2;--mu:#8e9ba7;--bd:#26313a;--gs:#12301f;--rs:#3a1a1c;--as:#3a2e12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tajawal,Tahoma,sans-serif;font-size:16px}
header{background:#111;color:#fff;height:56px;padding:0 14px;display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{margin:0;font-size:19px;font-weight:800;flex:1}
header button{background:none;border:0;color:#fff;display:grid;place-items:center;padding:6px;cursor:pointer}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#111;z-index:10}
.chat{display:grid;gap:8px;margin-bottom:12px}
.bub{background:var(--card);border:1px solid var(--bd);border-radius:14px 14px 4px 14px;padding:10px 13px;max-width:88%;justify-self:end;line-height:1.8;white-space:pre-wrap;animation:rise .3s both}
.bub.me{background:var(--g);color:#fff;border-color:var(--g);justify-self:start;border-radius:14px 14px 14px 4px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--gd);display:grid;place-items:center;flex:none}
main{max-width:760px;margin:0 auto;padding:14px 14px 96px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:13px;padding:12px;text-align:center}
.stat b{display:block;font-size:23px;color:var(--g)}
.stat span{font-size:12px;color:var(--mu)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.toolbar>*{flex:1;min-width:120px}
.stu-actions{display:flex;gap:4px;align-items:center}
.smallbtn{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:9px;padding:6px 8px;font:inherit;font-size:12px;cursor:pointer}
.hint{padding:10px 12px;border-radius:10px;background:var(--gs);color:var(--gd);font-size:13px;margin:8px 0}
@media(max-width:520px){.sh{flex-wrap:wrap}.sh .nm{min-width:90px}.stu-actions{flex-wrap:wrap}.toolbar .btn{flex:1;justify-content:center}}
@media(max-width:420px){.statgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.stat{padding:9px 4px}.stat b{font-size:20px}.ci{gap:8px}.ci button{width:54px;height:54px;min-width:54px}}

.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--g);color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px}
.btn.o{background:var(--card);color:var(--g);border:1.5px solid var(--g)}
.btn.s{display:inline-flex;align-items:center;gap:6px;width:auto;padding:8px 14px;font-size:14px;margin:0}
.btn:disabled{opacity:.5}
input,textarea,select{width:100%;padding:12px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;margin-top:6px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--g)}
textarea{min-height:110px}
h2{font-size:16px;font-weight:800;margin:0 0 6px}
.mu{color:var(--mu);font-size:14px}
.row{display:flex;align-items:center;gap:10px}
.sec{font-weight:800;font-size:15px;margin:18px 2px 8px;color:var(--mu)}
.add{border:2px dashed var(--g);background:var(--gs);color:var(--g);border-radius:14px;padding:18px;text-align:center;font-weight:800;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px;width:100%;font:inherit;font-weight:800;font-size:17px}
.ls{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer}
.ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;flex:none}
.stu{padding:12px 0;border-bottom:1px solid var(--bd)}
.stu:last-child{border:0}
.sh{display:flex;align-items:center;gap:10px;font-weight:700}
.sh .n{color:var(--mu);font-size:13px;width:20px;text-align:center}
.sh .nm{flex:1}
.tot{background:var(--gs);color:var(--g);border-radius:20px;padding:3px 12px;font-weight:800;font-size:15px;min-width:42px;text-align:center}
.tot.neg{background:var(--rs);color:var(--rd)}
.ci{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.ci button{position:relative;width:58px;height:58px;min-width:58px;border-radius:50%;border:2px solid var(--bd);background:var(--bg);font-size:15px;cursor:pointer;padding:0;color:var(--tx);overflow:visible;display:grid;place-items:center}.ci button img{width:100%;height:100%;display:block;object-fit:cover;border-radius:50%}.ci button .pic-fallback{font-size:19px;font-weight:800;color:var(--g)}
.ci button.pos{background:var(--gs);border-color:var(--g)}
.ci button.neg{background:var(--rs);border-color:var(--rd)}
.ci button.neu{background:var(--as);border-color:var(--am)}
.ci button.on{animation:pop .25s}
.ci b{position:absolute;top:-5px;right:-5px;z-index:5;background:#14251b;color:#fff;border:2px solid var(--card);border-radius:12px;min-width:23px;height:23px;padding:0 5px;display:grid;place-items:center;font-size:11px;font-weight:900;line-height:1;font-family:inherit;box-shadow:0 2px 5px #0003;pointer-events:none}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.ex{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--mu)}
.ex input{width:84px;margin:0;padding:7px;text-align:center}
.sheet{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:30}
.sheet>div{background:var(--card);width:100%;max-width:640px;margin:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.opts button{border:0;border-radius:12px;padding:10px 2px 8px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:5px}.opts .opt-photo{width:66px;height:66px;border-radius:50%;object-fit:cover;border:2px solid var(--bd);background:var(--card)}.opts .pic-fallback{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:2px solid var(--bd);font-size:23px;font-weight:800;color:var(--g)}
.opts button.pos{background:var(--gs)}.opts button.neg{background:var(--rs)}.opts button.neu{background:var(--as)}

 add("ترتيب الطلاب والبحث","3. الأعلى نقاطاً أولاً",c=>{c.students.sort((a,b)=>total(b)-total(a));save();render()});
 add("ترتيب الطلاب والبحث","4. الأقل نقاطاً أولاً",c=>{c.students.sort((a,b)=>total(a)-total(b));save();render()});
 add("ترتيب الطلاب والبحث","5. الأعلى في درجة الاختبار",c=>{c.students.sort((a,b)=>(Number(b.exam)||0)-(Number(a.exam)||0));save();render()});
 add("ترتيب الطلاب والبحث","6. عكس ترتيب القائمة",c=>{c.students.reverse();save();render()});
 add("ترتيب الطلاب والبحث","7. البحث عن طالب بالاسم",c=>{const q=prompt("اكتب جزءاً من اسم الطالب:");if(q===null)return;const a=c.students.filter(x=>x.name.toLowerCase().includes(q.trim().toLowerCase()));show("نتائج البحث",a.length?a.map(x=>x.name+" — "+total(x)+" نقطة").join("\n"):"لا توجد نتائج")});
 add("ترتيب الطلاب والبحث","8. عرض الطلاب بلا نقاط",c=>{const a=c.students.filter(x=>total(x)===0);show("طلاب بلا نقاط",a.map(x=>x.name).join("\n")||"لا يوجد")});
 add("ترتيب الطلاب والبحث","9. اكتشاف الأسماء المكررة",c=>{const map={};c.students.forEach(x=>{const k=x.name.trim().toLowerCase();(map[k]||(map[k]=[])).push(x.name)});const a=Object.values(map).filter(x=>x.length>1);show("الأسماء المكررة",a.map(x=>x[0]+" (مكرر "+x.length+" مرات)").join("\n")||"لا توجد أسماء مكررة")});
 add("ترتيب الطلاب والبحث","10. نسخ أسماء الطلاب",c=>copy(c.students.map(x=>x.name).join("\n")));
 // 11–20: الدرجات والدوائر
 add("الدرجات والدوائر","11. تعيين درجة اختبار موحدة للجميع",c=>{const n=askNum("درجة الاختبار الجديدة لكل الطلاب:",0);if(n===null)return;c.students.forEach(x=>x.exam=n);save();alert("تم تحديث درجات الاختبار")});
 add("الدرجات والدوائر","12. زيادة درجة الاختبار للجميع",c=>{const n=askNum("كم درجة تريد إضافتها؟",1);if(n===null)return;c.students.forEach(x=>x.exam=(Number(x.exam)||0)+n);save();alert("تمت إضافة الدرجات")});
 add("الدرجات والدوائر","13. خصم درجة من الاختبار للجميع",c=>{const n=askNum("كم درجة تريد خصمها؟",1);if(n===null)return;c.students.forEach(x=>x.exam=(Number(x.exam)||0)-n);save();alert("تم الخصم")});
 add("الدرجات والدوائر","14. تصفير درجات الاختبار",c=>{if(!confirm("تصفير درجات الاختبار لجميع طلاب الفصل؟"))return;c.students.forEach(x=>x.exam=0);save();alert("تم التصفير")});
 add("الدرجات والدوائر","15. إضافة نقاط تشجيعية للجميع",c=>{const n=Math.round(Math.abs(askNum("عدد النقاط الإضافية:",1)||0));if(!n)return;const d=giveAll(c,ensureOpt("bonus","نقاط تشجيعية",1),n);render();alert("أُضيفت "+n+" نقطة لـ "+d+" طالب. من امتلأت دوائره لم يتأثر.")});
 add("الدرجات والدوائر","16. خصم نقاط موحدة من الجميع",c=>{const n=Math.round(Math.abs(askNum("عدد النقاط المراد خصمها:",1)||0));if(!n)return;const d=giveAll(c,ensureOpt("penalty","خصم",-1),n);render();alert("خُصمت "+n+" نقطة من "+d+" طالب. من امتلأت دوائره لم يتأثر.")});
 add("الدرجات والدوائر","17. مسح جميع الدوائر للفصل",c=>{if(!confirm("مسح جميع علامات الدوائر لكل الطلاب؟ لا يمكن التراجع."))return;c.students.forEach(x=>x.marks=Array(S.n).fill(null));save();alert("تم مسح الدوائر")});
 add("الدرجات والدوائر","18. تصفير جميع درجات ونقاط الفصل",c=>{if(!confirm("تصفير كل درجات الاختبار والدوائر؟"))return;c.students.forEach(x=>{x.exam=0;x.marks=Array(S.n).fill(null)});save();alert("تم تصفير بيانات الدرجات")});
 add("الدرجات والدوائر","19. تقرير عدد مرات كل إضافة وخصم",c=>{const lines=OPTS.map(o=>o[1]+": "+c.students.reduce((n,x)=>n+(x.marks||[]).reduce((z,m)=>z+(m&&m.o===o[0]?(Number(m.c)||1):0),0),0)+" مرة");show("إحصائية الإضافات والخصم",lines.join("\n"))});
 add("الدرجات والدوائر","20. تصدير تفاصيل النقاط CSV",c=>exportClassCSV(c));
 // 21–30: الحضور
 add("الحضور اليومي","21. تسجيل الكل حاضراً اليوم",c=>{const d=attendance(c);c.students.forEach(x=>d[x.id]="present");save();alert("تم تسجيل الجميع حاضرين")});
 add("الحضور اليومي","22. تسجيل الكل غائباً اليوم",c=>{if(!confirm("تسجيل جميع الطلاب غائبين اليوم؟"))return;const d=attendance(c);c.students.forEach(x=>d[x.id]="absent");save();alert("تم تسجيل الغياب")});
 add("الحضور اليومي","23. تسجيل الكل متأخراً اليوم",c=>{const d=attendance(c);c.students.forEach(x=>d[x.id]="late");save();alert("تم تسجيل التأخر")});
 add("الحضور اليومي","24. مسح حضور اليوم",c=>{if(!confirm("مسح سجل حضور هذا الفصل لهذا اليوم؟"))return;const d=S.attendance[today()];if(d)delete d[c.id];save();alert("تم مسح سجل اليوم")});
 add("الحضور اليومي","25. تصدير حضور اليوم CSV",c=>{const d=attendance(c);csv(c,[["اسم الطالب","الحالة"],...c.students.map(x=>[x.name,({present:"حاضر",absent:"غائب",late:"متأخر",excused:"مستأذن"})[d[x.id]]||"لم يسجل"])],"attendance-today.csv")});
 add("الحضور اليومي","26. ملخص حضور اليوم",c=>{const d=attendance(c),v={present:0,absent:0,late:0,excused:0,none:0};c.students.forEach(x=>{const k=d[x.id]||"none";if(v[k]!==undefined)v[k]++});show("ملخص حضور اليوم",`حاضر: ${v.present}\nغائب: ${v.absent}\nمتأخر: ${v.late}\nمستأذن: ${v.excused}\nلم يسجل: ${v.none}`)});
 add("الحضور اليومي","27. أكثر الطلاب غياباً",c=>{const a=c.students.map(x=>({name:x.name,n:Object.values(S.attendance).reduce((n,d)=>n+(d&&d[c.id]&&d[c.id][x.id]==="absent"?1:0),0)})).sort((a,b)=>b.n-a.n);show("ترتيب الغياب",a.map((x,i)=>(i+1)+". "+x.name+" — "+x.n+" غياب").join("\n"))});
 add("الحضور اليومي","28. عرض الطلاب الذين لم يسجل حضورهم",c=>{const d=attendance(c),a=c.students.filter(x=>!d[x.id]);show("لم يسجل حضورهم",a.map(x=>x.name).join("\n")||"تم تسجيل الجميع")});
 add("الحضور اليومي","29. إنشاء جلسة حضور بتاريخ اليوم",c=>{attendance(c);save();alert("تم إنشاء سجل حضور بتاريخ "+today())});
 add("الحضور اليومي","30. طباعة كشف حضور فارغ",c=>{const t=el("div",{},el("h2",{style:"text-align:center"},"كشف حضور — "+c.name),el("p",{},"التاريخ: "+today()),el("table",{},el("tr",{},el("th",{},"م"),el("th",{},"اسم الطالب"),el("th",{},"حاضر"),el("th",{},"غائب"),el("th",{},"توقيع")),...c.students.map((x,i)=>el("tr",{},el("td",{},i+1),el("td",{},x.name),el("td",{},"□"),el("td",{},"□"),el("td",{},"")))));const w=window.open("","_blank");if(!w)return alert("اسمح بالنوافذ المنبثقة للطباعة");w.document.write("<html dir='rtl'><meta charset='utf-8'><title>كشف حضور</title><style>body{font-family:Tahoma;padding:25px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #555;padding:8px;text-align:center}</style>"+t.outerHTML+"</html>");w.document.close();w.print()});
 // 31–40: التحليل والتقارير
 add("التحليل والتقارير","31. متوسط درجات الفصل",c=>{const a=c.students.map(total),n=a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*100)/100:0;show("متوسط الفصل",n+" نقطة")});
 add("التحليل والتقارير","32. أعلى طالب في النقاط",c=>{const x=c.students.slice().sort((a,b)=>total(b)-total(a))[0];show("الأعلى نقاطاً",x?x.name+" — "+total(x):"لا يوجد طلاب")});
 add("التحليل والتقارير","33. أقل طالب في النقاط",c=>{const x=c.students.slice().sort((a,b)=>total(a)-total(b))[0];show("الأقل نقاطاً",x?x.name+" — "+total(x):"لا يوجد طلاب")});
 add("التحليل والتقارير","34. أفضل خمسة طلاب",c=>show("أفضل خمسة",c.students.slice().sort((a,b)=>total(b)-total(a)).slice(0,5).map((x,i)=>(i+1)+". "+x.name+" — "+total(x)).join("\n")||"لا يوجد"));
 add("التحليل والتقارير","35. أقل خمسة طلاب",c=>show("أقل خمسة",c.students.slice().sort((a,b)=>total(a)-total(b)).slice(0,5).map((x,i)=>(i+1)+". "+x.name+" — "+total(x)).join("\n")||"لا يوجد"));
 add("التحليل والتقارير","36. توزيع الطلاب حسب النقاط",c=>{const bins={"أقل من صفر":0,"0 إلى 5":0,"6 إلى 10":0,"11 إلى 20":0,"أكثر من 20":0};c.students.forEach(x=>{const n=total(x);if(n<0)bins["أقل من صفر"]++;else if(n<=5)bins["0 إلى 5"]++;else if(n<=10)bins["6 إلى 10"]++;else if(n<=20)bins["11 إلى 20"]++;else bins["أكثر من 20"]++});show("توزيع النقاط",Object.entries(bins).map(([k,v])=>k+": "+v).join("\n"))});
 add("التحليل والتقارير","37. الطلاب الأكثر مشاركة إيجابية",c=>{const a=c.students.map(x=>({name:x.name,n:(x.marks||[]).reduce((n,m)=>n+(m&&(S.pts[m.o]||0)>0?(Number(m.c)||1):0),0)})).sort((a,b)=>b.n-a.n);show("المشاركة الإيجابية",a.slice(0,10).map((x,i)=>(i+1)+". "+x.name+" — "+x.n).join("\n"))});
 add("التحليل والتقارير","38. الطلاب الأكثر حصولاً على الخصم",c=>{const a=c.students.map(x=>({name:x.name,n:(x.marks||[]).reduce((n,m)=>n+(m&&(S.pts[m.o]||0)<0?(Number(m.c)||1):0),0)})).sort((a,b)=>b.n-a.n);show("تكرار الخصم",a.slice(0,10).map((x,i)=>(i+1)+". "+x.name+" — "+x.n).join("\n"))});
 add("التحليل والتقارير","39. الطلاب بلا أي مشاركة مسجلة",c=>{const a=c.students.filter(x=>!(x.marks||[]).some(Boolean));show("بلا مشاركة",a.map(x=>x.name).join("\n")||"جميع الطلاب لديهم تسجيلات")});
 add("التحليل والتقارير","40. تصدير ملخص درجات الفصل CSV",c=>{const rows=[["الطالب","الاختبار","النقاط الكلية"],...c.students.map(x=>[x.name,x.exam||0,total(x)])];csv(c,rows,"class-summary.csv")});
 // 41–50: إدارة ونسخ وطباعة
 add("إدارة ونسخ وطباعة","41. طباعة قائمة الطلاب",c=>{const w=window.open("","_blank");if(!w)return alert("اسمح بالنوافذ المنبثقة للطباعة");w.document.write("<html dir='rtl'><meta charset='utf-8'><title>قائمة الطلاب</title><style>body{font-family:Tahoma;padding:25px}li{padding:7px;border-bottom:1px solid #ddd}</style><h2>طلاب "+c.name+"</h2><ol>"+c.students.map(x=>"<li>"+x.name.replace(/[&<>]/g,z=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[z]))+"</li>").join("")+"</ol></html>");w.document.close();w.print()});
 add("إدارة ونسخ وطباعة","42. نسخ كشف الطلاب مع النقاط",c=>copy(c.students.map((x,i)=>(i+1)+". "+x.name+" — "+total(x)+" نقطة").join("\n")));
 add("إدارة ونسخ وطباعة","43. نسخ ملخص الفصل",c=>copy("الفصل: "+c.name+"\nعدد الطلاب: "+c.students.length+"\nالمتوسط: "+(c.students.length?(c.students.reduce((n,x)=>n+total(x),0)/c.students.length).toFixed(2):0)));
 add("إدارة ونسخ وطباعة","44. إضافة ملاحظة جماعية للطلاب",c=>{const v=prompt("اكتب الملاحظة التي تريد إضافتها لكل طالب:");if(!v||!v.trim())return;c.students.forEach(x=>{x.notes=Array.isArray(x.notes)?x.notes:[];x.notes.push({text:v.trim(),date:new Date().toISOString()})});save();alert("تمت إضافة الملاحظة إلى "+c.students.length+" طالب")});
 add("إدارة ونسخ وطباعة","45. إضافة طالب جديد بسرعة",c=>{const v=prompt("اسم الطالب الجديد:");if(!v||!v.trim())return;if(c.students.some(x=>x.name.trim().toLowerCase()===v.trim().toLowerCase()))return alert("هذا الاسم موجود بالفعل");c.students.push({id:uid(),name:v.trim(),marks:[],exam:"",notes:[]});save();alert("تمت إضافة الطالب")});
 add("إدارة ونسخ وطباعة","46. استيراد أسماء من نص متعدد الأسطر",c=>{const v=prompt("الصق أسماء الطلاب، اسم في كل سطر:");if(!v)return;let n=0;v.split(/[\n,،;]/).map(x=>x.trim()).filter(Boolean).forEach(name=>{if(!c.students.some(x=>x.name.toLowerCase()===name.toLowerCase())){c.students.push({id:uid(),name,marks:[],exam:"",notes:[]});n++}});save();alert("تم استيراد "+n+" طالب")});
 add("إدارة ونسخ وطباعة","47. حذف الطلاب بلا درجات أو نقاط",c=>{const a=c.students.filter(x=>!Number(x.exam)&&!(x.marks||[]).some(Boolean));if(!a.length)return alert("لا يوجد طلاب بلا درجات");if(!confirm("سيتم حذف "+a.length+" طالب. هل أنت متأكد؟"))return;c.students=c.students.filter(x=>!a.includes(x));save();alert("تم الحذف")});
 add("إدارة ونسخ وطباعة","48. مراجعة الطلاب الذين لا يملكون ملف ملاحظات",c=>{const a=c.students.filter(x=>!(x.notes||[]).length);show("طلاب بلا ملاحظات",a.map(x=>x.name).join("\n")||"كل الطلاب لديهم ملاحظات")});
 add("إدارة ونسخ وطباعة","49. تنزيل نسخة احتياطية كاملة",()=>exportBackup());
 add("إدارة ونسخ وطباعة","50. استعادة نسخة احتياطية",()=>{const f=el("input",{type:"file",accept:"application/json,.json"});f.onchange=()=>{const file=f.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.classes)||!d.pts)throw Error();if(!confirm("سيتم استبدال بيانات التطبيق الحالية. هل تريد المتابعة؟"))return;S={...S,...d};OPTS=BASE.map(x=>x.slice(0,3)).concat(S.custom||[]);save();alert("تمت الاستعادة");root("home")}catch(e){alert("النسخة الاحتياطية غير صالحة")}};r.readAsText(file)};f.click()});
 // 51–150: أدوات إضافية عملية
 const safeName=x=>String(x.name||"").replace(/[&<>]/g,z=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[z]));
 const sortedBy=(c,fn)=>c.students.slice().sort(fn);
 const allNotes=(c,txt)=>{c.students.forEach(st=>{st.notes=Array.isArray(st.notes)?st.notes:[];st.notes.push({text:txt,date:new Date().toISOString()})});save()};
 const statusLabel={present:"حاضر",absent:"غائب",late:"متأخر",excused:"مستأذن"};
 const scoreList=c=>c.students.map(st=>({st,score:total(st)}));
 const attendanceDays=c=>Object.keys(S.attendance||{}).sort().filter(d=>S.attendance[d]&&S.attendance[d][c.id]);
 const addTool=(g,n,fn)=>add(g,n,fn);
 // 51–60: متابعة فردية
 addTool("متابعة الطلاب","51. عرض الطلاب أصحاب الدرجات الكاملة",c=>show("درجات كاملة",c.students.filter(x=>pctOf(x)>=100).map(x=>x.name).join("\n")||"لا يوجد طلاب بدرجة 100"));
 addTool("متابعة الطلاب","52. عرض الطلاب ذوي الدرجات المنخفضة",c=>show("درجات أقل من 60",c.students.filter(x=>pctOf(x)<60&&x.exam!=="").map(x=>x.name+" — "+x.exam).join("\n")||"لا يوجد"));
 addTool("متابعة الطلاب","53. الطلاب الذين لم يدخلوا درجة اختبار",c=>show("درجات غير مدخلة",c.students.filter(x=>x.exam===""||x.exam==null).map(x=>x.name).join("\n")||"اكتملت الدرجات"));
 addTool("متابعة الطلاب","54. قائمة الطلاب مع إجمالي نقاطهم",c=>show("إجمالي نقاط الطلاب",scoreList(c).map(x=>x.st.name+" — "+x.score).join("\n")));
 addTool("متابعة الطلاب","55. اختيار طالب عشوائي",c=>{if(!c.students.length)return alert("لا يوجد طلاب");const x=c.students[Math.floor(Math.random()*c.students.length)];show("الطالب المختار",x.name)});
 addTool("متابعة الطلاب","56. اختيار ثلاثة طلاب عشوائياً",c=>{const a=c.students.slice().sort(()=>Math.random()-.5).slice(0,3);show("اختيار عشوائي",a.map(x=>x.name).join("\n")||"لا يوجد طلاب")});
 addTool("متابعة الطلاب","57. نسخ أسماء الطلاب مع أرقامهم",c=>copy(c.students.map((x,i)=>(i+1)+"- "+x.name).join("\n")));
 addTool("متابعة الطلاب","58. إضافة ملاحظة لطالب محدد",c=>{const x=pickSt(c,"اكتب اسم الطالب:");if(!x)return alert("لم يتم العثور على الطالب");const t=prompt("اكتب الملاحظة:");if(!t||!t.trim())return;allNotes({students:[x]},t.trim());alert("تم حفظ الملاحظة")});
 addTool("متابعة الطلاب","59. تقرير الطلاب الذين لديهم ملاحظات",c=>show("ملفات الملاحظات",c.students.filter(x=>(x.notes||[]).length).map(x=>x.name+" — "+x.notes.length+" ملاحظة").join("\n")||"لا توجد ملاحظات"));
 addTool("متابعة الطلاب","60. عدد الطلاب في الفصل",c=>show("عدد الطلاب",String(c.students.length)+" طالب"));
 // 61–70: الحضور المتقدم
 addTool("الحضور المتقدم","61. نسبة حضور الفصل اليوم",c=>{const d=attendance(c),n=c.students.filter(x=>d[x.id]==="present").length;show("نسبة الحضور",c.students.length?Math.round(n/c.students.length*100)+"% ("+n+" من "+c.students.length+")":"لا يوجد طلاب")});
 addTool("الحضور المتقدم","62. تقرير الغياب خلال آخر 7 أيام",c=>{const ds=attendanceDays(c).slice(-7);show("غياب آخر 7 أيام",c.students.map(st=>st.name+": "+ds.filter(d=>S.attendance[d][c.id][st.id]==="absent").length).join("\n"))});
 addTool("الحضور المتقدم","63. تقرير التأخر خلال آخر 7 أيام",c=>{const ds=attendanceDays(c).slice(-7);show("تأخر آخر 7 أيام",c.students.map(st=>st.name+": "+ds.filter(d=>S.attendance[d][c.id][st.id]==="late").length).join("\n"))});
 addTool("الحضور المتقدم","64. أكثر الطلاب التزاماً بالحضور",c=>{const ds=attendanceDays(c),a=c.students.map(st=>({n:st.name,v:ds.filter(d=>S.attendance[d][c.id][st.id]==="present").length})).sort((a,b)=>b.v-a.v);show("الأكثر حضوراً",a.slice(0,10).map(x=>x.n+" — "+x.v+" يوم").join("\n"))});
 addTool("الحضور المتقدم","65. طباعة أسماء الغائبين اليوم",c=>{const d=attendance(c),a=c.students.filter(x=>d[x.id]==="absent");show("الغائبون اليوم",a.map(x=>x.name).join("\n")||"لا يوجد غائبون")});
 addTool("الحضور المتقدم","66. تسجيل الكل مستأذناً",c=>{if(!confirm("تسجيل جميع الطلاب مستأذنين اليوم؟"))return;const d=attendance(c);c.students.forEach(x=>d[x.id]="excused");save();alert("تم التسجيل")});
 addTool("الحضور المتقدم","67. مسح حالة طالب من حضور اليوم",c=>{const st=pickSt(c,"اختر الطالب المراد مسح حضوره:");if(!st)return alert("لم يتم العثور عليه");const d=attendance(c);delete d[st.id];save();alert("تم مسح الحالة")});
 addTool("الحضور المتقدم","68. عدد أيام تسجيل الحضور",c=>show("أيام الحضور المسجلة",String(attendanceDays(c).length)+" يوم"));
 addTool("الحضور المتقدم","69. تصدير سجل الغياب CSV",c=>{const ds=attendanceDays(c),rows=[["الطالب",...ds],...c.students.map(st=>[st.name,...ds.map(d=>S.attendance[d][c.id][st.id]==="absent"?"غائب":"-")])];csv(c,rows,"absence-history.csv")});
 addTool("الحضور المتقدم","70. مقارنة الحضور والغياب",c=>{const ds=attendanceDays(c);let p=0,a=0,l=0;ds.forEach(d=>c.students.forEach(st=>{const v=S.attendance[d][c.id][st.id];if(v==="present")p++;if(v==="absent")a++;if(v==="late")l++}));show("مقارنة الحضور",`حضور: ${p}\nغياب: ${a}\nتأخر: ${l}`)});
 // 71–80: الدرجات والاختبارات
 addTool("الاختبارات والدرجات","71. أعلى درجة اختبار",c=>{const x=sortedBy(c,(a,b)=>(Number(b.exam)||0)-(Number(a.exam)||0))[0];show("أعلى درجة",x?x.name+" — "+(x.exam||0):"لا يوجد")});
 addTool("الاختبارات والدرجات","72. متوسط درجة الاختبار",c=>{const a=c.students.filter(x=>x.exam!=="").map(x=>Number(x.exam)||0);show("متوسط الاختبار",a.length?(a.reduce((p,v)=>p+v,0)/a.length).toFixed(2):"لم تدخل درجات")});
 addTool("الاختبارات والدرجات","73. عدد الناجحين حسب 50 درجة",c=>show("الناجحون",String(c.students.filter(x=>pctOf(x)>=50).length)+" طالب"));
 addTool("الاختبارات والدرجات","74. عدد من هم دون 50 درجة",c=>show("أقل من 50",String(c.students.filter(x=>x.exam!==""&&pctOf(x)<50).length)+" طالب"));
 addTool("الاختبارات والدرجات","75. تحويل الدرجات إلى نسبة مئوية من 100",c=>show("النسب المئوية",c.students.map(x=>x.name+": "+Math.round(pctOf(x))+"%").join("\n")));
 addTool("الاختبارات والدرجات","76. رفع درجات الاختبار بمقدار قابل للتحديد",c=>{const n=askNum("كم درجة تضاف لكل طالب؟",1);if(n===null)return;c.students.forEach(x=>x.exam=Math.min(Number(x.examMax)||100,(Number(x.exam)||0)+n));save();alert("تمت الزيادة مع حد أقصى 100")});
 addTool("الاختبارات والدرجات","77. خفض درجات الاختبار بمقدار قابل للتحديد",c=>{const n=askNum("كم درجة تخصم من كل طالب؟",1);if(n===null)return;c.students.forEach(x=>x.exam=Math.max(0,(Number(x.exam)||0)-n));save();alert("تم الخصم دون النزول عن صفر")});
 addTool("الاختبارات والدرجات","78. ترتيب الطلاب حسب درجة الاختبار",c=>{c.students.sort((a,b)=>(Number(b.exam)||0)-(Number(a.exam)||0));save();render()});
 addTool("الاختبارات والدرجات","79. تصدير ترتيب الاختبار CSV",c=>csv(c,[["الترتيب","الطالب","الدرجة"],...sortedBy(c,(a,b)=>(Number(b.exam)||0)-(Number(a.exam)||0)).map((x,i)=>[i+1,x.name,x.exam||0])],"exam-ranking.csv"));
 addTool("الاختبارات والدرجات","80. إنشاء تقرير درجات مختصر",c=>show("تقرير الدرجات",`عدد الطلاب: ${c.students.length}\nالمتوسط: ${c.students.length?(c.students.reduce((n,x)=>n+(Number(x.exam)||0),0)/c.students.length).toFixed(2):0}\nأعلى درجة: ${Math.max(0,...c.students.map(x=>Number(x.exam)||0))}\nأقل درجة: ${c.students.length?Math.min(...c.students.map(x=>Number(x.exam)||0)):0}`));
 // 81–90: رسائل وتواصل
 addTool("التواصل والملاحظات","81. صياغة رسالة شكر لولي الأمر",c=>{const st=pickSt(c,"اسم الطالب:");if(!st)return alert("لم يتم العثور على الطالب");copy("السلام عليكم، نود إبلاغكم بتميز الطالب "+st.name+" ونشكر لكم دعمكم ومتابعتكم. مع خالص التقدير، "+S.teacher)});
 addTool("التواصل والملاحظات","82. صياغة تنبيه غياب لولي الأمر",c=>{const st=pickSt(c,"اسم الطالب:");if(!st)return alert("لم يتم العثور على الطالب");copy("السلام عليكم، نود إشعاركم بغياب الطالب "+st.name+" اليوم، ونأمل الاطمئنان عليه ومتابعة انتظامه. شكراً لتعاونكم.")});
 addTool("التواصل والملاحظات","83. صياغة رسالة متابعة دراسية",c=>{const st=pickSt(c,"اسم الطالب:");if(!st)return alert("لم يتم العثور على الطالب");copy("السلام عليكم، نرجو متابعة مستوى الطالب "+st.name+" في المنزل، والاهتمام بمراجعة الدروس والواجبات. شاكرين تعاونكم.")});
 addTool("التواصل والملاحظات","84. إعلان واجب للفصل",c=>{const v=prompt("اكتب الواجب وموعد التسليم:");if(v)copy("إعلان لطلاب فصل "+c.name+":\n"+v+"\nالمعلم: "+S.teacher)});
 addTool("التواصل والملاحظات","85. رسالة تذكير بالاختبار",c=>{const v=prompt("المادة وموعد الاختبار:");if(v)copy("تذكير لطلاب "+c.name+": يرجى الاستعداد للاختبار في "+v+" وإحضار الأدوات اللازمة.")});
 addTool("التواصل والملاحظات","86. إضافة ملاحظة متابعة جماعية",c=>{const v=prompt("ملاحظة المتابعة:");if(v&&v.trim()){allNotes(c,v.trim());alert("تمت إضافة الملاحظة")}});
 addTool("التواصل والملاحظات","87. نسخ قائمة المتفوقين",c=>copy(sortedBy(c,(a,b)=>total(b)-total(a)).slice(0,10).map((x,i)=>(i+1)+". "+x.name+" — "+total(x)).join("\n")));
 addTool("التواصل والملاحظات","88. نسخ قائمة الطلاب الذين يحتاجون متابعة",c=>copy(c.students.filter(x=>pctOf(x)<60&&x.exam!=="").map(x=>x.name).join("\n")));
 addTool("التواصل والملاحظات","89. عرض ملاحظات طالب",c=>{const st=pickSt(c,"اسم الطالب:");if(!st)return alert("لم يتم العثور عليه");show("ملاحظات "+st.name,(st.notes||[]).map(n=>n.text).join("\n")||"لا توجد ملاحظات")});
 addTool("التواصل والملاحظات","90. مسح ملاحظات طالب",c=>{const st=pickSt(c,"اسم الطالب:");if(!st)return alert("لم يتم العثور عليه");if(!confirm("مسح جميع ملاحظات "+st.name+"؟"))return;st.notes=[];save();alert("تم المسح")});
 // 91–100: إدارة الفصل
 addTool("إدارة الفصل","91. تغيير اسم الفصل",c=>{const v=prompt("اسم الفصل الجديد:",c.name);if(v&&v.trim()){c.name=v.trim();save();render()}});
 addTool("إدارة الفصل","92. حذف الأسماء المكررة والإبقاء على نسخة",c=>{const seen=new Set(),before=c.students.length;c.students=c.students.filter(x=>{const k=x.name.trim().toLowerCase();if(seen.has(k))return false;seen.add(k);return true});save();alert("تم حذف "+(before-c.students.length)+" اسم مكرر")});
 addTool("إدارة الفصل","93. نقل طالب إلى فصل آخر",c=>{const st=pickSt(c,"اختر الطالب المراد نقله:");if(!st)return alert("لم يتم العثور على الطالب");const o=S.classes.filter(x=>x!==c);if(!o.length)return alert("لا يوجد فصل آخر");const dest=o[Number(prompt("اكتب رقم الفصل الهدف:\n"+o.map((x,i)=>(i+1)+". "+x.name).join("\n")))-1];if(!dest)return;if(dest.students.some(x=>x.name===st.name))return alert("الطالب موجود في الفصل الآخر");Object.values(S.attendance||{}).forEach(day=>{const a=day&&day[c.id];if(a&&a[st.id]){(day[dest.id]=day[dest.id]||{})[st.id]=a[st.id];delete a[st.id]}});dest.students.push(st);c.students=c.students.filter(x=>x!==st);save();render();alert("تم نقل "+st.name+" إلى "+dest.name+" مع سجل حضوره.")});
 addTool("إدارة الفصل","94. إنشاء مجموعة عمل من 4 طلاب",c=>{const a=c.students.slice().sort(()=>Math.random()-.5);const groups=[];for(let i=0;i<a.length;i+=4)groups.push("المجموعة "+(groups.length+1)+": "+a.slice(i,i+4).map(x=>x.name).join("، "));show("مجموعات العمل",groups.join("\n\n")||"لا يوجد طلاب")});
 addTool("إدارة الفصل","95. تقسيم الطلاب إلى مجموعات",c=>{const n=askNum("كم مجموعة تريد؟",4);if(!n||n<1)return;const a=c.students.slice().sort(()=>Math.random()-.5),g=Array.from({length:Math.min(20,Math.floor(n))},()=>[]);a.forEach((x,i)=>g[i%g.length].push(x.name));show("تقسيم المجموعات",g.map((x,i)=>"المجموعة "+(i+1)+": "+x.join("، ")).join("\n\n"))});
 addTool("إدارة الفصل","96. ترتيب الطلاب حسب الاسم الأول",c=>{c.students.sort((a,b)=>a.name.trim().split(/\s+/)[0].localeCompare(b.name.trim().split(/\s+/)[0],"ar"));save();render()});
 addTool("إدارة الفصل","97. إنشاء قائمة جلوس عشوائية",c=>{const a=c.students.slice().sort(()=>Math.random()-.5);show("توزيع المقاعد",a.map((x,i)=>"المقعد "+(i+1)+": "+x.name).join("\n"))});
 addTool("إدارة الفصل","98. تصدير قائمة الطلاب TXT",c=>{const blob=new Blob(["طلاب "+c.name+"\n"+names(c)],{type:"text/plain;charset=utf-8"}),u=URL.createObjectURL(blob),a=el("a",{href:u,download:"students.txt"});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)});
 addTool("إدارة الفصل","99. إضافة رقم تسلسلي لأسماء الطلاب في النسخ",c=>copy(c.students.map((x,i)=>String(i+1).padStart(2,"0")+" | "+x.name).join("\n")));
 addTool("إدارة الفصل","100. فحص سلامة بيانات الطلاب",c=>{const issues=[];c.students.forEach(x=>{if(!x.id)issues.push(x.name+": رقم داخلي مفقود");if(!x.name.trim())issues.push("اسم فارغ");if(!Array.isArray(x.marks))issues.push(x.name+": سجل الدوائر غير صالح")});show("فحص البيانات",issues.join("\n")||"لم يتم العثور على أخطاء واضحة")});
 // 101–110: السلوك والتحفيز
 addTool("السلوك والتحفيز","101. منح خيار إيجابي لكل الطلاب",c=>{const o=OPTS.filter(x=>(S.pts[x[0]]||0)>0);const k=prompt("اكتب رقم الخيار:\n"+o.map((x,i)=>(i+1)+". "+x[1]).join("\n"));const v=o[Number(k)-1];if(!v)return;const d=giveAll(c,v,1);render();alert("تم منح «"+v[1]+"» لـ "+d+" طالب. من امتلأت دوائره لم يتأثر.")});
 addTool("السلوك والتحفيز","102. منح خيار إيجابي لطالب",c=>{const st=pickSt(c,"اسم الطالب:");if(!st)return alert("لم يتم العثور عليه");const o=OPTS.filter(x=>(S.pts[x[0]]||0)>0);const choice=prompt("اكتب رقم الخيار:\n"+o.map((x,i)=>(i+1)+". "+x[1]).join("\n"));const v=o[Number(choice)-1];if(!v)return;const i=(st.marks||[]).findIndex(m=>!m);if(i<0)st.marks.push({o:v[0],c:1});else st.marks[i]={o:v[0],c:1};save();alert("تم تسجيل "+v[1])});
 addTool("السلوك والتحفيز","103. منح خصم لطالب",c=>{const st=pickSt(c,"اسم الطالب:");if(!st)return alert("لم يتم العثور عليه");const o=OPTS.filter(x=>(S.pts[x[0]]||0)<0);if(!o.length)return alert("لا توجد خيارات خصم");const choice=prompt("اختر رقم الخصم:\n"+o.map((x,i)=>(i+1)+". "+x[1]).join("\n"));const v=o[Number(choice)-1];if(!v)return;const i=(st.marks||[]).findIndex(m=>!m);if(i<0)st.marks.push({o:v[0],c:1});else st.marks[i]={o:v[0],c:1};save();alert("تم تسجيل الخصم")});
 addTool("السلوك والتحفيز","104. تقرير التفاعلات الإيجابية والسلبية",c=>{const p=c.students.reduce((n,x)=>n+(x.marks||[]).reduce((z,m)=>z+(m&&(S.pts[m.o]||0)>0?(Number(m.c)||1):0),0),0),q=c.students.reduce((n,x)=>n+(x.marks||[]).reduce((z,m)=>z+(m&&(S.pts[m.o]||0)<0?(Number(m.c)||1):0),0),0);show("السلوك",`تفاعلات إيجابية: ${p}\nتفاعلات سلبية: ${q}`)});
 addTool("السلوك والتحفيز","105. أكثر خيار إيجابي استخداماً",c=>{const a=OPTS.filter(o=>(S.pts[o[0]]||0)>0).map(o=>({name:o[1],n:c.students.reduce((z,x)=>z+(x.marks||[]).reduce((v,m)=>v+(m&&m.o===o[0]?(Number(m.c)||1):0),0),0)})).sort((a,b)=>b.n-a.n);show("الأكثر استخداماً",a.slice(0,5).map(x=>x.name+" — "+x.n).join("\n"))});
 addTool("السلوك والتحفيز","106. أكثر خيار خصم استخداماً",c=>{const a=OPTS.filter(o=>(S.pts[o[0]]||0)<0).map(o=>({name:o[1],n:c.students.reduce((z,x)=>z+(x.marks||[]).reduce((v,m)=>v+(m&&m.o===o[0]?(Number(m.c)||1):0),0),0)})).sort((a,b)=>b.n-a.n);show("أكثر الخصومات",a.slice(0,5).map(x=>x.name+" — "+x.n).join("\n")||"لا توجد خصومات")});
 addTool("السلوك والتحفيز","107. مسح جميع الخصومات للفصل",c=>{if(!confirm("مسح كل خيارات الخصم فقط؟"))return;c.students.forEach(st=>st.marks=(st.marks||[]).map(m=>m&&(S.pts[m.o]||0)<0?null:m));save();render()});
 addTool("السلوك والتحفيز","108. مسح جميع الإضافات الإيجابية للفصل",c=>{if(!confirm("مسح كل الخيارات الإيجابية فقط؟"))return;c.students.forEach(st=>st.marks=(st.marks||[]).map(m=>m&&(S.pts[m.o]||0)>0?null:m));save();render()});
 addTool("السلوك والتحفيز","109. عرض الطلاب أصحاب الخصومات",c=>show("طلاب لديهم خصومات",c.students.filter(st=>(st.marks||[]).some(m=>m&&(S.pts[m.o]||0)<0)).map(st=>st.name).join("\n")||"لا يوجد"));
 addTool("السلوك والتحفيز","110. عرض الطلاب أصحاب الإضافات",c=>show("طلاب لديهم إضافات",c.students.filter(st=>(st.marks||[]).some(m=>m&&(S.pts[m.o]||0)>0)).map(st=>st.name).join("\n")||"لا يوجد"));
 // 111–120: تقارير قابلة للطباعة
 addTool("تقارير وطباعة","111. طباعة تقرير طالب محدد",c=>{const st=pickSt(c,"اسم الطالب:");if(!st)return alert("لم يتم العثور عليه");const w=window.open("","_blank");if(!w)return alert("اسمح بالنوافذ المنبثقة");w.document.write("<html dir='rtl'><meta charset='utf-8'><title>تقرير طالب</title><body style='font-family:Tahoma;padding:25px'><h2>تقرير الطالب: "+safeName(st)+"</h2><p>الفصل: "+safeName(c)+"</p><p>درجة الاختبار: "+(st.exam||0)+"</p><p>مجموع النقاط: "+total(st)+"</p><p>المعلم: "+safeName({name:S.teacher})+"</p></body></html>");w.document.close();w.print()});
 addTool("تقارير وطباعة","112. طباعة قائمة الطلاب مع درجاتهم",c=>{const w=window.open("","_blank");if(!w)return alert("اسمح بالنوافذ المنبثقة");const rows=c.students.map(x=>"<tr><td>"+safeName(x)+"</td><td>"+(x.exam||0)+"</td><td>"+total(x)+"</td></tr>").join("");w.document.write("<html dir='rtl'><meta charset='utf-8'><title>كشف الدرجات</title><style>body{font-family:Tahoma;padding:20px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #777;padding:8px;text-align:center}</style><h2>كشف درجات "+safeName(c)+"</h2><table><tr><th>الطالب</th><th>الاختبار</th><th>النقاط</th></tr>"+rows+"</table></html>");w.document.close();w.print()});
 addTool("تقارير وطباعة","113. طباعة أسماء الطلاب مع مربعات توقيع",c=>{const w=window.open("","_blank");if(!w)return alert("اسمح بالنوافذ المنبثقة");w.document.write("<html dir='rtl'><meta charset='utf-8'><style>body{font-family:Tahoma;padding:20px}td,th{border:1px solid #555;padding:10px}table{width:100%;border-collapse:collapse}</style><h2>كشف توقيع — "+safeName(c)+"</h2><table><tr><th>م</th><th>الاسم</th><th>التوقيع</th></tr>"+c.students.map((x,i)=>"<tr><td>"+(i+1)+"</td><td>"+safeName(x)+"</td><td></td></tr>").join("")+"</table></html>");w.document.close();w.print()});
 addTool("تقارير وطباعة","114. تصدير تقرير النقاط Excel CSV",c=>exportClassCSV(c));
